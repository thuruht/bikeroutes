  body { font-family: "Inter", system-ui, sans-serif; }
  .brand .name, .summary .dist, .explore-head h3 { font-family: "Outfit", system-ui, sans-serif; }
  /* maplibre attribution tucked + themed */
  .maplibregl-ctrl-attrib { background: var(--panel) !important; color: var(--muted-txt) !important; font-size: 10px !important; border-radius: 8px !important; }
  .maplibregl-ctrl-attrib a { color: var(--ink-2) !important; }
  .maplibregl-marker { cursor: default; }

  /* ============================================================
     PENULTIMATE BRAND INTEGRATION (v0.9 RC)
     New logo system wired into the live app chrome.
     ============================================================ */

  /* app-icon tile — the b-wheel mark on a forest-green chip */
  .brand .app-tile {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    background: var(--green); display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), var(--shadow-sm);
  }
  .brand .app-tile svg {
    width: 21px; height: 21px;
    color: var(--brand-cream-white);
    --ac: var(--brand-blaze-orange);
  }
  .brand-txt { display: flex; flex-direction: column; gap: 1px; }

  /* wordmark — Reki's head is the dot on the "i" */
  .wordmark {
    display: inline-flex; align-items: baseline;
    font-family: var(--font-head); font-weight: 700;
    letter-spacing: -.02em; line-height: 1; color: var(--ink);
    font-size: 16.5px;
  }
  .wordmark .tld { color: var(--muted-txt); font-weight: 500; }
  .wordmark .i-slot { position: relative; display: inline-block; width: .2em; height: .74em; vertical-align: baseline; }
  .wordmark .i-slot .stem { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: .135em; height: .5em; background: currentColor; border-radius: .05em; }
  .wordmark .i-slot .head { position: absolute; left: 50%; bottom: .6em; transform: translateX(-50%); line-height: 0; }
  .wordmark .i-slot .head svg { display: block; width: .68em; height: .68em; }

  /* penultimate / release-candidate chip */
  .ver-chip {
    align-self: center; margin-left: 2px;
    font-size: 9.5px; font-weight: 600; letter-spacing: .05em;
    color: var(--orange); background: var(--orange-soft);
    padding: 3px 7px; border-radius: var(--radius-pill);
    border: 1px solid color-mix(in oklab, var(--orange) 34%, transparent);
    white-space: nowrap;
  }

  @media (max-width: 420px) {
    .ver-chip { display: none; }
  }
</style>
