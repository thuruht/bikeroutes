<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>BikeRoutes.org — Free open cycling maps for the Midwest 🦌</title>
    <meta name="description" content="Free, ad-free, open-source bike route planner for the US Midwest. Surface-aware routing (paved, gravel, dirt, singletrack), elevation profiles, turn-by-turn, and GPX/KML export. Powered by OpenStreetMap." />
    <meta name="author" content="bikeroutes.org" />
    <link rel="canonical" href="https://bikeroutes.org/" />

    <!-- Theme — Tactical dark is the primary brand expression -->
    <meta name="theme-color" content="#0B0C08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/reki_icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BikeRoutes.org" />
    <meta property="og:title" content="BikeRoutes.org — Free open cycling maps for the Midwest" />
    <meta property="og:description" content="Ad-free, open-source bike route planner. Surface-aware routing, elevation, turn-by-turn, GPX/KML export. Powered by OpenStreetMap." />
    <meta property="og:url" content="https://bikeroutes.org/" />
    <meta property="og:image" content="https://bikeroutes.org/reki_icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BikeRoutes.org — Free open cycling maps for the Midwest" />
    <meta name="twitter:description" content="Ad-free, open-source bike route planner for the Midwest. Reki's scouted every trail." />
    <meta name="twitter:image" content="https://bikeroutes.org/reki_icon.png" />

    <!-- Fonts — Outfit (display) · IBM Plex Sans (body) · IBM Plex Mono (data).
         Self-hosted-friendly, privacy-respecting Bunny Fonts (never Google). -->
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
    <link href="https://fonts.bunny.net/css?family=outfit:400,500,600,700|ibm-plex-sans:400,500,600|ibm-plex-mono:400,500,600" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
